name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  native-sim:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install open-source EDA toolchain
        run: bash scripts/install-tools-ubuntu.sh

      - name: Run native simulation checks
        run: bash scripts/check-native.sh

      - name: Run assembler regression corpus
        run: bash scripts/run-asm-corpus.sh --runner mmio

      - name: Run assembler regression corpus through APB
        run: bash scripts/run-asm-corpus.sh --runner apb

      - name: Run assembler regression corpus through MMIO wait-state
        run: bash scripts/run-asm-corpus.sh --runner mmio_wait

      - name: Upload native artifacts
        uses: actions/upload-artifact@v4
        with:
          name: native-artifacts
          path: |
            sim_build/coverage.json
            sim_build/coverage.csv
            sim_build/mmio_coverage.json
            sim_build/mmio_coverage.csv
            sim_build/mmio_wait_coverage.json
            sim_build/mmio_wait_coverage.csv
            sim_build/apb_coverage.json
            sim_build/apb_coverage.csv
            sim_build/asm_corpus

  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install open-source EDA toolchain
        run: bash scripts/install-tools-ubuntu.sh

      - name: Run lint
        run: bash scripts/lint.sh

      - name: Upload lint artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lint-artifacts
          path: |
            sim_build/static_analysis

  formal:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install open-source EDA toolchain
        run: bash scripts/install-tools-ubuntu.sh

      - name: Run formal checks
        run: bash scripts/run-formal.sh --mode all

      - name: Upload formal artifacts
        uses: actions/upload-artifact@v4
        with:
          name: formal-artifacts
          path: |
            formal/simple_cpu
            formal/simple_cpu_mmio
            formal/simple_cpu_mmio_wait
            formal/simple_cpu_apb
            formal/simple_cpu_cover
            formal/simple_cpu_mmio_cover
            formal/simple_cpu_mmio_wait_cover
            formal/simple_cpu_apb_cover

  cocotb-verilator:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install open-source EDA toolchain
        run: bash scripts/install-tools-ubuntu.sh

      - name: Install Python verification dependencies
        run: |
          python3 -m venv .venv_ci
          source .venv_ci/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          echo "$PWD/.venv_ci/bin" >> "$GITHUB_PATH"

      - name: Run cocotb + Verilator regression with coverage
        run: bash scripts/run-cocotb-verilator.sh --no-waves --coverage

      - name: Upload Verilator artifacts
        uses: actions/upload-artifact@v4
        with:
          name: verilator-artifacts
          path: |
            sim_build/verilator_results.xml
            sim_build/verilator_coverage

  equivalence:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install open-source EDA toolchain
        run: bash scripts/install-tools-ubuntu.sh

      - name: Run EQY equivalence checks
        run: bash scripts/run-equiv.sh

      - name: Upload equivalence artifacts
        uses: actions/upload-artifact@v4
        with:
          name: equivalence-artifacts
          path: |
            equiv/simple_cpu_eqy

  pyuvm:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install open-source EDA toolchain
        run: bash scripts/install-tools-ubuntu.sh

      - name: Install Python verification dependencies
        run: |
          python3 -m venv .venv_ci
          source .venv_ci/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          echo "$PWD/.venv_ci/bin" >> "$GITHUB_PATH"

      - name: Run pyuvm regression
        run: bash scripts/run-uvm.sh --no-waves

      - name: Run MMIO pyuvm regression
        run: bash scripts/run-mmio-uvm.sh --no-waves

      - name: Run cocotb MMIO regression
        run: bash scripts/run-cocotb-mmio.sh --no-waves

      - name: Run cocotb MMIO wait-state regression
        run: bash scripts/run-cocotb-mmio-wait.sh --no-waves

      - name: Run MMIO wait-state pyuvm regression
        run: bash scripts/run-mmio-wait-uvm.sh --no-waves

      - name: Run cocotb APB regression
        run: bash scripts/run-cocotb-apb.sh --no-waves

      - name: Run APB pyuvm regression
        run: bash scripts/run-apb-uvm.sh --no-waves

      - name: Upload pyuvm artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pyuvm-artifacts
          path: |
            sim_build/pyuvm_coverage.json
            sim_build/uvm_results.xml
            sim_build/mmio_uvm_results.xml
            sim_build/mmio_cocotb_results.xml
            sim_build/mmio_wait_uvm_results.xml
            sim_build/mmio_wait_cocotb_results.xml
            sim_build/apb_uvm_results.xml
            sim_build/apb_cocotb_results.xml

  mutations:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install open-source EDA toolchain
        run: bash scripts/install-tools-ubuntu.sh

      - name: Run mutation campaign
        run: bash scripts/run-mutations.sh

      - name: Upload mutation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mutation-artifacts
          path: |
            sim_build/mutations

  summary:
    if: always()
    runs-on: ubuntu-latest
    needs:
      - native-sim
      - lint
      - formal
      - cocotb-verilator
      - equivalence
      - pyuvm
      - mutations

    steps:
      - name: Publish workflow summary
        run: |
          cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          # CI Summary

          | Job | Result |
          |---|---|
          | native-sim | ${{ needs.native-sim.result }} |
          | lint | ${{ needs.lint.result }} |
          | formal | ${{ needs.formal.result }} |
          | cocotb-verilator | ${{ needs.cocotb-verilator.result }} |
          | equivalence | ${{ needs.equivalence.result }} |
          | pyuvm | ${{ needs.pyuvm.result }} |
          | mutations | ${{ needs.mutations.result }} |
          EOF

      - name: Fail summary if any required job failed
        run: |
          results="${{ needs.native-sim.result }},${{ needs.lint.result }},${{ needs.formal.result }},${{ needs.cocotb-verilator.result }},${{ needs.equivalence.result }},${{ needs.pyuvm.result }},${{ needs.mutations.result }}"
          case "${results}" in
            *failure*|*cancelled*)
              exit 1
              ;;
          esac
